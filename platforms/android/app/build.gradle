plugins {
    id 'com.android.application'
}

def versionNameStr = (System.getenv("DUSK_VERSION") ?: "v0.1.0").replaceFirst("^v", "")
def versionCodeInt = (System.getenv("DUSK_VERSION_CODE") ?: "100000").toInteger()

def duskRepoDir = rootProject.projectDir.parentFile.parentFile
def duskGeneratedAssetsDir = layout.buildDirectory.dir('generated/assets/dawnlight').get().asFile
def releaseSigningPropsFile = new File(duskRepoDir, 'keystores/release-signing.properties')
def releaseSigningProps = new Properties()
if (releaseSigningPropsFile.exists()) {
    releaseSigningPropsFile.withInputStream { releaseSigningProps.load(it) }
}
def syncDuskAssets = tasks.register('syncDuskAssets', Sync) {
    from(new File(duskRepoDir, 'res')) {
        into 'res'
        exclude '**/.DS_Store'
    }
    into duskGeneratedAssetsDir
}

android {
    namespace 'dev.bezide.dawnlight'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.bezide.dawnlight'
        minSdk 26
        targetSdk 36
        versionCode versionCodeInt
        versionName versionNameStr
    }

    signingConfigs {
        if (releaseSigningPropsFile.exists()) {
            release {
                def configuredStoreFile = releaseSigningProps.getProperty('storeFile')
                def storeFilePath = new File(configuredStoreFile)
                if (!storeFilePath.isAbsolute()) {
                    storeFilePath = new File(duskRepoDir, configuredStoreFile)
                }

                storeFile storeFilePath
                storePassword releaseSigningProps.getProperty('storePassword')
                keyAlias releaseSigningProps.getProperty('keyAlias')
                keyPassword releaseSigningProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (releaseSigningPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = [duskGeneratedAssetsDir]
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.configureEach { task ->
    if ((task.name.startsWith('merge') && task.name.endsWith('Assets')) ||
        task.name.toLowerCase().contains('lint')) {
        task.dependsOn(syncDuskAssets)
    }
}
